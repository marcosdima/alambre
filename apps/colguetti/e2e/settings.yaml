appId: host.exp.exponent
tags:
  - settings
---
- tapOn:
    id: "settings-button"
- assertVisible: ".*(Ajustes|Settings).*"
- assertVisible: ".*(Idioma|Language).*"
- tapOn: "EN"
- assertVisible: "Settings"
- assertVisible: "Language"
- tapOn: "ES"
- assertVisible: "Ajustes"
- assertVisible: "Idioma"
- scrollUntilVisible:
    element:
      text: ".*(Notificaciones|Notifications).*"
    direction: DOWN
- assertVisible: ".*(Notificaciones|Notifications).*"
- tapOn: ".*(prueba|Test).*"
- assertVisible: ".*(enviada|sent).*"
- scrollUntilVisible:
    element:
      text: ".*(Apoyar|Support).*"
    direction: DOWN
- tapOn:
    id: "support-button"
- assertVisible: ".*(Apoyá|Support).*"
- tapOn:
    id: "support-close-button"
- back
- assertVisible: "Colguetti"
