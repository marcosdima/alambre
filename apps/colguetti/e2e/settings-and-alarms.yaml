appId: host.exp.exponent
---
- tapOn:
    id: "settings-button"
- assertVisible: ".*(Ajustes|Settings).*"
- assertVisible: ".*(Idioma|Language).*"
- tapOn: "EN"
- assertVisible: "Settings"
- assertVisible: "Language"
- tapOn: "ES"
- assertVisible: "Ajustes"
- assertVisible: "Idioma"
- scrollUntilVisible:
    element:
      text: ".*(Notificaciones|Notifications).*"
    direction: DOWN
- assertVisible: ".*(Notificaciones|Notifications).*"
- tapOn: ".*(prueba|Test).*"
- assertVisible: ".*(enviada|sent).*"
- back
- assertVisible: "Colguetti"
- tapOn: ".*(Alarmas|Alarms).*"
- assertVisible: ".*(Alarmas|Alarms).*"
- scrollUntilVisible:
    element:
      text: ".*(Agregar|Add).*"
    direction: DOWN
- tapOn: ".*(Agregar|Add).*"
- assertVisible: ".*(Nueva alarma|New alarm).*"
- back
- assertVisible: ".*(Alarmas|Alarms).*"
- back
- assertVisible: "Colguetti"
