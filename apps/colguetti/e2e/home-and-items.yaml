appId: host.exp.exponent
---
- assertVisible: "Colguetti"
- assertVisible: ".*(Mis ítems|My items).*"
- assertVisible: ".*(Alarmas|Alarms).*"
- tapOn:
    id: "support-button"
- assertVisible: ".*Apoyá.*"
- tapOn:
    id: "support-close-button"
- tapOn: ".*(Mis ítems|My items).*"
- assertVisible: ".*(Mis ítems|My items).*"
- scrollUntilVisible:
    element:
      text: ".*(Agregar|Add).*"
    direction: DOWN
- tapOn: ".*(Agregar|Add).*"
- tapOn:
    id: "item-name-input"
- eraseText
- inputText: "Llaves"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: ".*(Guardar|Save).*"
    direction: DOWN
- tapOn: ".*(Guardar|Save).*"
- assertVisible: "Llaves"
- back
- assertVisible: "Colguetti"
- assertVisible: ".*(ÍTEMS|ITEMS).*"
- tapOn:
    id: "settings-button"
- assertVisible: ".*(Ajustes|Settings).*"
- back
- assertVisible: "Colguetti"
