appId: host.exp.exponent
tags:
  - alarms
---
- tapOn: ".*(Alarmas|Alarms).*"
- assertVisible: ".*(Alarmas|Alarms).*"
- scrollUntilVisible:
    element:
      text: ".*(Agregar|Add).*"
    direction: DOWN
- tapOn: ".*(Agregar|Add).*"
- assertVisible: ".*(Nueva alarma|New alarm).*"
- tapOn:
    id: "alarm-label-input"
- eraseText
- inputText: "Trabajo"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: ".*(Guardar|Save).*"
    direction: DOWN
- tapOn: ".*(Guardar|Save).*"
- assertVisible: "Trabajo"
- back
- assertVisible: "Colguetti"
