appId: host.exp.exponent
---
- tapOn: ".*(Mis ítems|My items).*"
- assertVisible: ".*(Mis ítems|My items).*"
# Swipe left on first item to directly trigger delete confirmation dialog
- swipe:
    start: "85%,20%"
    end: "15%,20%"
- assertVisible: ".*(\\?|¿).*"
- tapOn: ".*(Cancelar|Cancel).*"
- back
- assertVisible: "Colguetti"
